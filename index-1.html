<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X Stars Uz</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f5f8;color:#111}.app{max-width:620px;margin:auto;padding:20px}.glass{background:#ffffff99;border:1px solid #ffffffaa;border-radius:28px;padding:20px;margin-bottom:12px;backdrop-filter:blur(24px);box-shadow:0 15px 45px #0001}.amount{font-size:38px;font-weight:800;margin:8px 0 18px}.btn{padding:13px 18px;border-radius:16px;border:1px solid #ffffffaa;background:#ffffff66;font-weight:700}.primary{background:#ffd21c;border:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{min-height:100px}.icon{font-size:26px;margin-bottom:10px}.small{color:#777;font-size:12px}.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(590px,calc(100% - 28px));display:flex;justify-content:space-around;padding:8px;border-radius:25px}.nav{background:transparent;border:0;padding:9px;font-weight:700}.page{animation:slide .4s ease}@keyframes slide{from{opacity:0;transform:translateX(28px);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}body.dark{background:#080a0f;color:#f5f5f7}body.dark .glass{background:#191c2490;border-color:#ffffff12}#sky{display:none}body.dark #sky{display:block;position:fixed;inset:0;z-index:-1;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:80px 80px;opacity:.18}</style></head><body><div id="sky"></div><div class="app"><h2>✦ X Stars Uz</h2><main id="content"></main></div><nav class="bottom glass"><button class="nav" onclick="openPage('home')">⌂<br>Asosiy</button><button class="nav" onclick="openPage('stars')">★<br>Stars</button><button class="nav" onclick="openPage('gifts')">🎁<br>Sovg‘a</button><button class="nav" onclick="openPage('history')">◷<br>Tarix</button><button class="nav" onclick="openPage('profile')">♙<br>Profil</button></nav><script>let balance=+(localStorage.xbalance||0),page='home';const gifts=[['🧸','Teddy Bear',15],['💝','Heart Gift',15],['🎁','Gift Box',25],['🌹','Rose',25],['💐','Bouquet',50],['🚀','Rocket',50],['🏆','Trophy',100],['💍','Ring',100],['🎄','Archa',50]];function money(n){return new Intl.NumberFormat('uz-UZ').format(n)+' so‘m'}function openPage(p){page=p;render()}function render(){let c=document.getElementById('content');let x='';if(page==='home')x=`<div class="page"><section class="glass"><div class="small">Balansingiz</div><div class="amount">${money(balance)}</div><button class="btn primary" onclick="topup()">＋ Balansni to‘ldirish</button></section><div class="grid">${[['★','Stars','50–5000','stars'],['★','Premium','3 / 6 / 12 oy','premium'],['🎁','Sovg‘alar','Stars bilan','gifts'],['◇','NFT','Tez orada','nft'],['◷','Tarix','Amallar','history'],['♙','Profil','Sozlamalar','profile']].map(a=>`<button class="tile glass" onclick="openPage('${a[3]}')"><div class="icon">${a[0]}</div><b>${a[1]}</b><div class="small">${a[2]}</div></button>`).join('')}</div><section class="glass"><b>Statistika</b><p class="small">Jonli savdo statistikasi backend ulanishidan keyin ishlaydi.</p></section><section class="glass"><b>Referal</b><p class="small">Referal bonusi: 3%</p><button class="btn" onclick="alert('Referal havola backend bilan ulanadi')">Havolam</button></section></div>`;else if(page==='stars')x=`<div class="page"><button class="btn" onclick="openPage('home')">←</button><section class="glass"><h2>Telegram Stars</h2><p class="small">1 Star = 230 so‘m</p><input id="n" type="number" min="50" max="5000" value="50" style="width:100%;padding:14px;box-sizing:border-box;border-radius:16px;border:1px solid #aaa;background:transparent;color:inherit"><div class="amount" style="font-size:26px" id="sp">11 500 so‘m</div><button class="btn primary" onclick="demoPay()">Davom etish</button></section></div>`;else if(page==='premium')x=`<div class="page"><button class="btn" onclick="openPage('home')">←</button><section class="glass"><h2>Telegram Premium</h2>${[['3 oy',165000],['6 oy',220000],['12 oy',405000]].map(a=>`<div class="glass"><b>${a[0]}</b><p>${money(a[1])}</p><button class="btn primary" onclick="balance+=${a[1]};save();openPage('home')">Tanlash</button></div>`).join('')}</section></div>`;else if(page==='gifts')x=`<div class="page"><button class="btn" onclick="openPage('home')">←</button><section class="glass"><h2>Sovg‘alar</h2><div class="grid">${gifts.map(g=>`<button class="tile glass" onclick="balance+=${g[2]*230};save();openPage('home')"><div class="icon">${g[0]}</div><b>${g[1]}</b><div class="small">${g[2]} Stars</div></button>`).join('')}</div></section></div>`;else if(page==='nft')x=`<div class="page"><button class="btn" onclick="openPage('home')">←</button><section class="glass" style="text-align:center"><div style="font-size:60px">◇</div><h2>NFT</h2><p class="small">Tez orada</p></section></div>`;else if(page==='history')x=`<div class="page"><button class="btn" onclick="openPage('home')">←</button><section class="glass"><h2>Tarix</h2><p class="small">Hozircha tarix bo‘sh.</p></section></div>`;else x=`<div class="page"><section class="glass"><h2>Profil</h2><p class="small">Telegram profil ma’lumotlari Mini App ichida olinadi.</p><button class="btn" onclick="document.body.classList.toggle('dark')">◐ Tungi rejim</button></section></div>`;c.innerHTML=x}function save(){localStorage.xbalance=balance}function topup(){balance+=100000;save();render()}function demoPay(){let n=Math.max(50,Math.min(5000,+(document.getElementById('n').value||50)));balance+=n*230;save();openPage('home')}render()</script></body></html>
